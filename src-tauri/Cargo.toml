[package]
name = "studyhub"
version = "0.1.0"
description = "StudyHub - offline-first study and work companion"
authors = ["StudyHub contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows/Android.
name = "studyhub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(not(target_os = "android"))'.dependencies]
# OS credential store (Windows Credential Manager, macOS Keychain). On Linux without a
# secret-service feature this falls back to the crate's in-memory mock store (dev only).
keyring = { version = "3", features = ["windows-native", "apple-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
